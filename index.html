<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ANALISIS MISTIK 4D V2.0</title>

/* =========================
   DASAR
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#ffffff;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
}


/* =========================
   HEADER
========================= */

.header{
    background:#10243d;
    border:1px solid #294e70;
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:8px 0 0;
    color:#9eb7cc;
    font-size:12px;
}


/* =========================
   CARD
========================= */

.card{
    background:#0d1c2e;
    border:1px solid #244662;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

.title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}


/* =========================
   INPUT
========================= */

label{
    display:block;
    margin-bottom:8px;
    color:#b9cce0;
    font-size:13px;
}

input{
    width:100%;
    padding:15px;

    background:#07111f;
    color:#ffffff;

    border:1px solid #315777;
    border-radius:10px;

    font-size:23px;
    text-align:center;
    letter-spacing:7px;

    outline:none;
}


/* =========================
   BUTTON
========================= */

button{
    width:100%;

    padding:14px;
    margin-top:10px;

    border:0;
    border-radius:10px;

    background:#1976d2;
    color:white;

    font-size:16px;
    font-weight:bold;
}

button.reset{
    background:#455a64;
}


/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}


/* =========================
   BOX
========================= */

.box{
    background:#07111f;

    border:1px solid #29465f;
    border-radius:10px;

    padding:13px;

    text-align:center;
}

.nama{
    color:#8fa8bd;
    font-size:11px;
}

.angka{
    margin-top:7px;

    font-size:22px;
    font-weight:bold;

    letter-spacing:3px;
}


/* =========================
   TOP 4D
========================= */

.top4d{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

    border-radius:10px;

    padding:13px;

    text-align:center;
}

.topitem small{

    color:#8fa8bd;

    font-size:11px;

    margin-bottom:5px;
}
