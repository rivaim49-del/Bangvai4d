<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANALISIS MISTIK 4D V2.0</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#07111f;
    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:15px;
}

/* HEADER */
.header{
    background:#10243d;
    border:1px solid #2b5577;
    border-radius:18px;
    padding:22px 15px;
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:23px;
    line-height:1.3;
}

.header p{
    margin:8px 0 0;
    color:#9db5ca;
    font-size:12px;
}

/* CARD */
.card{
    background:#0d1c2e;
    border:1px solid #294761;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

.title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:13px;
}

/* INPUT */
label{
    display:block;
    color:#b7cadb;
    font-size:13px;
    margin-bottom:8px;
}

input{
    width:100%;
    height:55px;
    padding:10px 15px;

    background:#07111f;
    color:#ffffff;

    border:1px solid #365e7e;
    border-radius:11px;

    outline:none;

    text-align:center;
    font-size:24px;
    letter-spacing:8px;
}

input:focus{
    border-color:#2196f3;
}

/* BUTTON */
button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    margin-top:10px;

    color:#ffffff;
    background:#1976d2;

    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.99);
}

button.reset{
    background:#455a64;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

/* BOX */
.box{
    background:#07111f;
    border:1px solid #29465f;
    border-radius:11px;
    padding:14px;
    text-align:center;
}

.nama{
    color:#8fa8bd;
    font-size:11px;
    text-transform:uppercase;
}

.angka{
    margin-top:7px;
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
    word-break:break-all;
}

/* RESULT FORMULA */
.formula{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

/* POSITION */
.position-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.position-box{
    background:#07111f;
    border:1px solid #29465f;
    border-radius:10px;
    padding:12px 5px;
    text-align:center;
}

.position-name{
    color:#8fa8bd;
    font-size:11px;
}

.position-number{
    margin-top:6px;
    font-size:21px;
    font-weight:bold;
}

/* DIGIT LIST */
.digit-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
}

.digit{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#102a44;
    border:1px solid #315777;

    font-size:18px;
    font-weight:bold;
}

/* TABLE */
.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th,
td{
    border:1px solid #29465f;
    padding:9px;
    text-align:center;
}

th{
    background:#142d47;
}

td{
    background:#07111f;
}

.status-kuat{
    color:#66bb6a;
    font-weight:bold;
}

.status-muncul{
    color:#42a5f5;
    font-weight:bold;
}

.status-rendah{
    color:#90a4ae;
}

/* BAR FREQUENCY */
.bar-wrap{
    width:100%;
    height:8px;
    margin-top:5px;
    background:#172b3d;
    border-radius:10px;
    overflow:hidden;
}

.bar{
    height:100%;
    background:#2196f3;
    border-radius:10px;
}

/* TOP 4D */
.top4d{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.topitem{
    position:relative;
    background:#07111f;
    border:1px solid #315777;
    border-radius:11px;
    padding:15px 10px;
    text-align:center;
}

.topitem small{
    display:block;
    color:#8fa8bd;
    font-size:11px;
    margin-bottom:6px;
}

.topitem b{
    display:block;
    font-size:24px;
    letter-spacing:4px;
}

.score{
    margin-top:6px;
    color:#78909c;
    font-size:10px;
}

/* NOTE */
.note{
    margin-top:12px;
    color:#8fa8bd;
    font-size:11px;
    line-height:1.5;
}

/* HIDDEN */
.hidden{
    display:none;
}

/* FOOTER */
.footer{
    padding:10px;
    text-align:center;
    color:#607b92;
    font-size:10px;
}

/* MOBILE */
@media(max-width:430px){

    .app{
        padding:10px;
    }

    .header h1{
        font-size:20px;
    }

    .position-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .position-number{
        font-size:18px;
    }

    .topitem b{
        font-size:21px;
    }
}

@media(max-width:340px){

    .grid,
    .formula,
    .top4d{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <h1>ANALISIS MISTIK 4D V2.0</h1>

        <p>
            ML • MB • INDX • TYSEN • M0 • M9
        </p>

    </div>


    <!-- INPUT -->
    <div class="card">

        <div class="title">
            INPUT RESULT
        </div>

        <label for="result">
            Masukkan result terakhir 4 digit
        </label>

        <input
            id="result"
            type="text"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
            placeholder="1234"
        >

        <button type="button" onclick="hitung()">
            ⚡ HITUNG ANALISIS
        </button>

        <button
            type="button"
            class="reset"
            onclick="resetApp()">

            RESET

        </button>

    </div>


    <!-- HASIL -->
    <div id="hasil" class="hidden">


        <!-- HASIL RUMUS -->
        <div class="card">

            <div class="title">
                HASIL RUMUS
            </div>

            <div
                id="formulaResult"
                class="formula">
            </div>

        </div>


        <!-- POSISI -->
        <div class="card">

            <div class="title">
                POSISI RESULT
            </div>

            <div class="position-grid">

                <div class="position-box">

                    <div class="position-name">
                        AS
